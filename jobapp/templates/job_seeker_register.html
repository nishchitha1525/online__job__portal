<!DOCTYPE html>
<html>
<head>
    <title>Job Seeker Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        .register-box {
            width: 400px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
            color: #007bff;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 11px;
            margin-top: 8px;
            margin-bottom: 18px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .password-container {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 18px;
            cursor: pointer;
            font-size: 20px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .message {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
            background: #f8d7da;
            color: #721c24;
        }

        p {
            text-align: center;
        }

        a {
            color: #007bff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .back {
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="register-box">

    <h2>Job Seeker Registration</h2>

    {% if messages %}
        {% for message in messages %}
            <div class="message">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <input
            type="text"
            name="fullname"
            placeholder="Full Name"
            required
        >

        <input
            type="email"
            name="email"
            placeholder="Email"
            required
        >

        <div class="password-container">

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Password"
                required
            >

            <span
                class="toggle-password"
                onclick="togglePassword('password')">
                👁️
            </span>

        </div>

        <div class="password-container">

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Confirm Password"
                required
            >

            <span
                class="toggle-password"
                onclick="togglePassword('confirm_password')">
                👁️
            </span>

        </div>

        <button type="submit">
            Register as Job Seeker
        </button>

    </form>

    <p>
        Already have an account?
        <a href="/login/">Login</a>
    </p>

    <p class="back">
        <a href="/register/">← Back to Registration</a>
    </p>

</div>

<script>

function togglePassword(id) {

    var password = document.getElementById(id);

    if (password.type === "password") {
        password.type = "text";
    } else {
        password.type = "password";
    }

}

</script>

</body>
</html>
