{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Online Job Portal
        {% endblock %}
    </title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            color: #333;
        }

        nav {
            background-color: #1e3a8a;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
        }

        nav .links a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 16px;
        }

        nav .links a:hover {
            text-decoration: underline;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        .login-container {
            width: 450px;
            max-width: 95%;
            margin: 60px auto;
            padding: 35px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .login-container h1 {
            color: #1e3a8a;
            margin-bottom: 10px;
        }

        .login-container h2 {
            margin-bottom: 30px;
            color: #555;
        }

        .login-option {
            display: block;
            text-decoration: none;
            color: #333;
            background: #f8fafc;
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 18px;
            margin: 15px 0;
            transition: 0.3s;
        }

        .login-option:hover {
            border-color: #1e3a8a;
            background: #eef4ff;
            transform: translateY(-2px);
        }

        .login-option h3 {
            color: #1e3a8a;
            margin-bottom: 8px;
        }

        .login-option p {
            color: #666;
        }

        .forgot-password {
            display: inline-block;
            margin-top: 15px;
            color: #1e3a8a;
            text-decoration: none;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        footer {
            margin-top: 50px;
            background: #1e3a8a;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

    <nav>
        <a href="{% url 'home' %}" class="logo">
            Online Job Portal
        </a>

        <div class="links">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'about' %}">About</a>
            <a href="{% url 'contact' %}">Contact</a>
        </div>
    </nav>

    <main class="container">

        {% block content %}
        {% endblock %}

    </main>

    <footer>
        <p>© 2026 Online Job Portal. All Rights Reserved.</p>
    </footer>

</body>
</html>
