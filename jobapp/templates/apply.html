<!DOCTYPE html>
<html>

<head>

    <title>Apply for Job</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
        }

        .container {
            width: 450px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
            color: #007bff;
        }

        .job-info {
            background: #eef6ff;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        .job-info h3 {
            color: #007bff;
            margin-top: 0;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 10px;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: green;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: darkgreen;
        }

        .success {
            color: green;
            text-align: center;
            font-weight: bold;
        }

        .error {
            color: red;
            text-align: center;
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #007bff;
            text-decoration: none;
        }

    </style>

</head>


<body>


<div class="container">


    <h2>
        Apply for Job
    </h2>


    <!-- Show messages -->

    {% if messages %}

        {% for message in messages %}

            <p class="{% if message.tags == 'error' %}error{% else %}success{% endif %}">
                {{ message }}
            </p>

        {% endfor %}

    {% endif %}


    <!-- Selected Job -->

    {% if job %}

        <div class="job-info">

            <h3>
                {{ job.title }}
            </h3>

            <p>
                <strong>Company:</strong>
                {{ job.company }}
            </p>

            <p>
                <strong>Location:</strong>
                {{ job.location }}
            </p>

            <p>
                <strong>Salary:</strong>
                ₹{{ job.salary }}
            </p>

        </div>

    {% endif %}


    <!-- Application Form -->

    <form
        method="POST"
        enctype="multipart/form-data"
    >

        {% csrf_token %}


        <!-- IMPORTANT: Job ID -->

        <input
            type="hidden"
            name="job_id"
            value="{{ job.id }}"
        >


        <label>
            Full Name
        </label>

        <input
            type="text"
            name="fullname"
            placeholder="Enter your full name"
            required
        >


        <label>
            Email
        </label>

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >


        <label>
            Phone Number
        </label>

        <input
            type="text"
            name="phone"
            placeholder="Enter your phone number"
            required
        >


        <label>
            Qualification
        </label>

        <input
            type="text"
            name="qualification"
            placeholder="Enter your qualification"
            required
        >


        <label>
            Upload Resume
        </label>

        <input
            type="file"
            name="resume"
            required
        >


        <button type="submit">
            Apply Now
        </button>


    </form>


    <a
        href="{% url 'jobs' %}"
        class="back"
    >
        ← Back to Jobs
    </a>


</div>


</body>

</html>
