<!DOCTYPE html>
<html>
<head>

    <title>Employer Registration</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        .register-box {
            width: 400px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
            color: #007bff;
            margin-bottom: 25px;
        }

        .message {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            margin-bottom: 20px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .password-container {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 20px;
            cursor: pointer;
            font-size: 20px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        p {
            text-align: center;
        }

        a {
            color: #007bff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .back {
            text-align: center;
            margin-top: 15px;
        }

    </style>

</head>

<body>

<div class="register-box">

    <h2>Employer Registration</h2>

    {% if messages %}

        {% for message in messages %}

            <div class="message"
                 style="background:#f8d7da;color:#721c24;">

                {{ message }}

            </div>

        {% endfor %}

    {% endif %}


    <form method="POST">

        {% csrf_token %}

        <input
            type="text"
            name="fullname"
            placeholder="Employer / Company Name"
            required
        >

        <input
            type="email"
            name="email"
            placeholder="Email"
            required
        >

        <div class="password-container">

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Password"
                required
            >

            <span
                class="toggle-password"
                onclick="togglePassword()"
            >
                👁️
            </span>

        </div>


        <div class="password-container">

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Confirm Password"
                required
            >

            <span
                class="toggle-password"
                onclick="toggleConfirmPassword()"
            >
                👁️
            </span>

        </div>


        <button type="submit">
            Register as Employer
        </button>

    </form>


    <p>
        Already have an account?
        <a href="/login/">Login</a>
    </p>

    <div class="back">

        <a href="/register/">
            ← Back to Registration
        </a>

    </div>

</div>


<script>

function togglePassword() {

    var password =
        document.getElementById("password");

    if (password.type === "password") {

        password.type = "text";

    } else {

        password.type = "password";

    }

}


function toggleConfirmPassword() {

    var password =
        document.getElementById("confirm_password");

    if (password.type === "password") {

        password.type = "text";

    } else {

        password.type = "password";

    }

}

</script>

</body>
</html>
