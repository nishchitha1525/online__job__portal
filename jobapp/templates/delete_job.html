<!DOCTYPE html>
<html>

<head>

    <title>Delete Job</title>

</head>

<body>

    <h1>Delete Job</h1>

    <p>
        Are you sure you want to delete:
        <strong>{{ job.title }}</strong>?
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Yes, Delete Job
        </button>

    </form>

    <br>

    <a href="{% url 'employer_dashboard' %}">
        Cancel
    </a>

</body>

</html>
