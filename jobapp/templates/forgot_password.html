<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>

    <style>
        body{
            font-family:Arial,sans-serif;
            background:#f2f2f2;
        }

        .box{
            width:420px;
            margin:50px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        h2{
            text-align:center;
            color:#007bff;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:10px;
            margin-bottom:15px;
            box-sizing:border-box;
        }

        .password-box{
            position:relative;
        }

        .eye{
            position:absolute;
            right:12px;
            top:18px;
            cursor:pointer;
        }

        .note{
            background:#fff3cd;
            color:#856404;
            padding:10px;
            border-radius:5px;
            font-size:14px;
            margin-bottom:15px;
        }

        button{
            width:100%;
            padding:12px;
            background:#007bff;
            color:white;
            border:none;
            border-radius:5px;
            font-size:18px;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }

        a{
            text-decoration:none;
            color:#007bff;
        }

        p{
            text-align:center;
        }
    </style>
</head>

<body>

<div class="box">

<h2>Forgot Password</h2>

<form method="POST">
{% csrf_token %}

<input type="email" name="email" placeholder="Enter Email Address" required>

<div class="password-box">
<input type="password" id="newpassword" name="newpassword" placeholder="New Password" required>
<span class="eye" onclick="showNew()">👁️</span>
</div>

<div class="password-box">
<input type="password" id="confirmpassword" name="confirmpassword" placeholder="Confirm Password" required>
<span class="eye" onclick="showConfirm()">👁️</span>
</div>

<div class="note">
<b>Password must contain:</b><br><br>

✔ At least 8 characters<br>
✔ One uppercase letter (A-Z)<br>
✔ One lowercase letter (a-z)<br>
✔ One number (0-9)<br>
✔ One special character (@, #, $, %, &, *)<br>
</div>

<button type="submit">Reset Password</button>

</form>

<p><a href="/login/">Back to Login</a></p>

</div>

<script>
function showNew(){
var x=document.getElementById("newpassword");
if(x.type=="password"){
x.type="text";
}else{
x.type="password";
}
}

function showConfirm(){
var x=document.getElementById("confirmpassword");
if(x.type=="password"){
x.type="text";
}else{
x.type="password";
}
}
</script>

</body>
</html>
