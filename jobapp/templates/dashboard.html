<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>

    <style>
        body{
            font-family:Arial;
            background:#f4f4f4;
            text-align:center;
        }

        h1{
            background:#007bff;
            color:white;
            padding:20px;
        }

        .box{
            width:300px;
            margin:30px auto;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        a{
            display:block;
            margin:15px;
            padding:10px;
            background:green;
            color:white;
            text-decoration:none;
            border-radius:5px;
        }
    </style>
</head>

<body>

<h1>Admin Dashboard</h1>

<div class="box">
    <a href="/admin/">Manage Jobs</a>
    <a href="/admin/jobapp/application/">View Applications</a>
    <a href="/jobs/">View Website</a>
</div>

</body>
</html>
