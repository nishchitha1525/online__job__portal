<!DOCTYPE html>
<html>
<head>
    <title>Change Password</title>

    <style>
        body{
            font-family:Arial;
            background:#f4f4f4;
        }

        .container{
            width:400px;
            margin:60px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        h2{
            text-align:center;
            color:#007bff;
        }

        input{
            width:100%;
            padding:10px;
            margin:10px 0;
        }

        button{
            width:100%;
            padding:12px;
            background:green;
            color:white;
            border:none;
            border-radius:5px;
            font-size:18px;
        }

        button:hover{
            background:darkgreen;
        }
    </style>
</head>

<body>

<div class="container">

<h2>Change Password</h2>

<form method="POST">
    {% csrf_token %}

    <input type="password" name="old_password" placeholder="Old Password" required>

    <input type="password" name="new_password" placeholder="New Password" required>

    <input type="password" name="confirm_password" placeholder="Confirm New Password" required>

    <button type="submit">Change Password</button>

</form>

</div>

</body>
</html>
