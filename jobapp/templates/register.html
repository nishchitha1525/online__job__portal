<!DOCTYPE html>
<html>

<head>

    <title>Registration</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        .register-box {

            width: 400px;

            margin: 80px auto;

            background: white;

            padding: 30px;

            border-radius: 10px;

            box-shadow: 0 0 10px gray;

            text-align: center;

        }

        h2 {

            color: #007bff;

            margin-bottom: 30px;

        }

        .register-button {

            display: block;

            width: 100%;

            padding: 15px;

            margin: 15px 0;

            box-sizing: border-box;

            border-radius: 5px;

            text-decoration: none;

            color: white;

            font-size: 18px;

        }

        .job-seeker {

            background: #28a745;

        }

        .job-seeker:hover {

            background: #218838;

        }

        .employer {

            background: #007bff;

        }

        .employer:hover {

            background: #0056b3;

        }

        p {

            margin-top: 25px;

        }

        a {

            color: #007bff;

            text-decoration: none;

        }

        a:hover {

            text-decoration: underline;

        }

    </style>

</head>


<body>


<div class="register-box">

    <h2>Create Your Account</h2>

    <p>Select your account type</p>


    <a
        href="/job-seeker-register/"
        class="register-button job-seeker"
    >

        👤 Job Seeker Register

    </a>


    <a
        href="/employer-register/"
        class="register-button employer"
    >

        🏢 Employer Register

    </a>


    <p>

        Already have an account?

        <a href="/login/">
            Login
        </a>

    </p>

</div>


</body>

</html>
