{% load static %}
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Online Job Portal</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
}

nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:70px;
    background:#od6efd;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 40px;
    z-index:1000;
}

nav h2{
    color:white;
}

nav ul{
    list-style:none;
    display:flex;
}

nav ul li{
    margin-left:25px;
}

nav ul li a{
    color:white;
    text-decoration:none;
    font-size:18px;
    font-weight:bold;
}

nav ul li a:hover{
    color:yellow;
}

.hero{
    width:100%;
    height:100vh;
    background:url("{% static 'images/newjob.jpg' %}");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    display:flex;
    justify-content:center;
    align-items:center;
}

.overlay{
    background:rgba(0,0,0,.5);
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:white;
    text-align:center;
}

.overlay h1{
    font-size:55px;
    margin-bottom:15px;
}

.overlay p{
    font-size:22px;
    margin-bottom:30px;
}

.search-box{
    display:flex;
    gap:10px;
}

.search-box input{
    width:220px;
    padding:12px;
    border:none;
    border-radius:5px;
}

.search-box button{
    padding:12px 25px;
    background:#28a745;
    color:white;
    border:none;
    border-radius:5px;
    font-size:17px;
    cursor:pointer;
}

.search-box button:hover{
    background:green;
}
</style>

</head>

<body>

<nav>
    <h2>JobPortal</h2>

    <ul>
        <li><a href="/">Home</a></li>

        {% if user.is_authenticated %}
            <li><a href="/jobs/">Jobs</a></li>
            <li><a href="{% url 'logout' %}">Logout</a></li>
        {% else %}
            <li><a href="/register/">Register</a></li>
            <li><a href="/login/">Login</a></li>
        {% endif %}

        <li><a href="/about/">About</a></li>
        <li><a href="/contact/">Contact</a></li>
    </ul>
</nav>

<section class="hero">

<div class="overlay">

<h1>Welcome to Online Job Portal</h1>

<p>Find Your Dream Job From Top Companies</p>

<form action="/jobs/" method="GET" class="search-box">

    <input type="text"
           name="title"
           placeholder="Job Title">

    <input type="text"
           name="location"
           placeholder="Location">

    <button type="submit">
        Search Jobs
    </button>

</form>

</div>

</section>

</body>
</html>
